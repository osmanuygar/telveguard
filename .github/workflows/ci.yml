# Her push / PR'da testler: hatayı sürüm tag'inden ÖNCE görmek için.
# (Uçtan uca testler Docker ortamı gerektirir; burada atlanır.)
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          # openai + anthropic: API biçimi testleri gerçek SDK'larla koşar (yoksa sessizce atlanırdı)
          pip install -r gateway/requirements.txt pytest pytest-asyncio cpex build twine openai anthropic \
              -e packages/telveguard-core -e packages/telveguard-contextforge
      - name: Testler
        run: pytest -q -rs
      - name: Tarayıcı eklentisi tespit motoru (JS == Python)
        run: node extension/tests/detectors.test.js
