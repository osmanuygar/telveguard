# Telveguard ICAP: Squid örneği. AI sitelerine giden (TLS denetimiyle çözülmüş) istekler
# gönderilmeden önce Telveguard'a sorulur (REQMOD). Kurumunuzda Squid yerine ProxySG,
# Forcepoint ya da Zscaler varsa aynı ayarlar o ürünün ICAP ekranında yapılır.
#
# Bu dosya yerel deneme içindir (docker-compose.icap.yml): TLS denetimi kapalı, http://
# istekleri gösterir. Üretimde ssl_bump ayarları kurumun mevcut proxy'sinden gelir.

http_port 3128

# Hangi siteler Telveguard'a sorulsun (gateway/app/icap.py SITES ile aynı liste)
acl ai_sites dstdomain .chatgpt.com .chat.openai.com .claude.ai .gemini.google.com
acl ai_sites dstdomain .copilot.microsoft.com .chat.deepseek.com .chat.mistral.ai .perplexity.ai .grok.com
acl ai_sites dstdomain .api.openai.com .api.anthropic.com .generativelanguage.googleapis.com
acl ai_sites dstdomain .api.mistral.ai .api.deepseek.com
acl body_methods method POST PUT PATCH

icap_enable on
icap_preview_enable off
# Kimlik: proxy'nin doğruladığı kullanıcı (Kerberos / NTLM / LDAP) ve istemci IP'si
icap_send_client_ip on
icap_send_client_username on
icap_client_username_encode on
icap_client_username_header X-Authenticated-User
# bypass=off: Telveguard'a ulaşılamazsa AI isteği durur (fail-closed). Açık bırakmak için bypass=on
icap_service telveguard reqmod_precache icap://gateway:1344/reqmod bypass=off
adaptation_access telveguard allow ai_sites body_methods
adaptation_access telveguard deny all

# Telveguard gateway'in kendi upstream trafiği (maskelenmiş istekler) bu proxy'den çıkıyorsa
# ICAP'e gönderilmemeli; ör. acl telveguard_gw src 10.20.0.0/24 + adaptation_access ... deny telveguard_gw

http_access allow all
access_log daemon:/var/log/squid/access.log
cache deny all
