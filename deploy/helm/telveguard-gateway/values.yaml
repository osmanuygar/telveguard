# Telveguard Gateway - Helm değerleri (OKD / OpenShift öncelikli).
# Kafka ve ClickHouse bu chart'ın parçası değildir; kurumdaki mevcut kümelere bağlanır.
# ClickHouse şeması: clickhouse/init.sql (bir kez çalıştırın).

image:
  # Air-gapped: Harbor yolu, ör. harbor.sirket.local/telveguard/gateway
  repository: telveguard/gateway
  tag: ""                 # boşsa Chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 2
# Pod başına uvicorn worker sayısı; ölçekleme için önce replica artırın
workers: 2

# ---------------- istemci kimliği ----------------
auth:
  # jwt: OIDC (Keycloak / Entra ID) token'ı zorunlu; kullanıcı ve ekipler token'dan gelir.
  # header: x-telveguard-user / x-telveguard-team header'ları, DOĞRULAMA YOK (yalnızca test).
  mode: jwt
  oidc:
    issuer: ""            # ör. https://sso.sirket.local/realms/ai  (zorunlu)
    audience: ""          # token'ın "aud" değeri, ör. telveguard     (zorunlu)
    jwksUrl: ""           # boşsa issuer/.well-known/openid-configuration'dan bulunur
    userClaim: preferred_username   # Entra ID: preferred_username / upn
    teamClaim: groups               # Keycloak rolleri için: realm_access.roles
    teamPrefix: ""                  # ör. "telveguard-": yalnızca bu önekli gruplar ekip sayılır
    # Bu gruptaki kullanıcılar yönetim uçlarına (Röntgen, simülatör, KVKK raporu) kendi JWT'leriyle
    # erişir; statik admin-token'a gerek kalmaz. Ör. telveguard-admin
    adminGroup: ""
    # telve (Cursor / Claude Code ajanı) bu public istemciyle cihaz akışından giriş yapar:
    # IdP'de "OAuth 2.0 Device Authorization Grant" açık, sırsız (public) bir istemci. Ör. telve
    agentClientId: ""

# ---------------- upstream LLM'ler ----------------
upstream:
  internalUrl: http://vllm:8000/v1          # kurum içi (vLLM / Ollama)
  externalUrl: https://api.openai.com/v1    # yurt dışı sağlayıcı (maskeli gider)
  # Anthropic /v1/messages (Claude SDK, Claude Code); taban adres /v1 içermez
  anthropicUrl: https://api.anthropic.com
  anthropicInternalUrl: ""                  # Anthropic biçimini kabul eden kurum içi sunucu (opsiyonel)

# ---------------- denetim (Kafka) ----------------
audit:
  kafkaBootstrap: ""      # ör. kafka-bootstrap.kafka.svc:9092 ; boşsa olaylar stdout'a JSON yazılır
  topic: telveguard.audit.v1
  # 1: maskelenmiş prompt da saklanır (PII yer tutucu hâlinde). Ham prompt hiçbir zaman saklanmaz.
  storeMasked: false

# ---------------- Röntgen + KVKK raporu (ClickHouse) ----------------
clickhouse:
  url: ""                 # ör. http://clickhouse.telveguard.svc:8123 ; boşsa Röntgen uçları 503 döner
  user: telveguard_reader # yalnızca SELECT yetkili kullanıcı önerilir
  database: telveguard

# ---------------- kota sayacı ----------------
# Politikada `quotas` varsa sayaç Redis'te tutulmalı; yoksa limitler worker / pod başına olur.
quota:
  redisUrl: ""            # ör. redis://redis.telveguard.svc:6379/0 (parola: secret'taki redis-password)

# ---------------- politika ----------------
policy:
  # Doluysa bu ConfigMap kullanılır (anahtar: policy.yaml); boşsa chart'taki files/policy.yaml
  existingConfigMap: ""
  # Chart'taki varsayılan politikayı tamamen değiştirmek için YAML metni (opsiyonel)
  content: ""
  # AI sistem beyanları (EU AI Act envanteri); boşsa chart'taki files/inventory.yaml örneği.
  # existingConfigMap kullanılıyorsa bu ConfigMap'te inventory.yaml anahtarı da olmalı.
  inventoryContent: ""
  # Konsoldan politika yönetimi (Politika sekmesi): sürümler ClickHouse'ta, onaylanan sürüm pod'lara
  # yeniden başlatmadan yayılır. clickhouse.url gerekli; çok pod'da quota.redisUrl önerilir (kilit).
  # Yazma ayrı kullanıcıyla (yalnızca policy_versions / policy_events; şifre: policy-store-password).
  store:
    enabled: false
    clickhouseUser: telveguard_policy
    pollSeconds: 5
    fourEyes: true          # sürümü yazan onaylayamaz (acil yayın gerekçeyle, kayıtta ayrı)
    insertQuorum: ""        # kopyalı ClickHouse: ör. "2"
    # Onaylanan sürümü Git'e yansıtma (Bitbucket Data Center). store.enabled gerekli.
    # Token: secret'ta policy-git-token (depoya yazma yetkili HTTP erişim token'ı).
    git:
      enabled: false
      provider: bitbucket-dc
      url: ""                 # https://bitbucket.sirket.local (bağlam yolu varsa dahil)
      webUrl: ""              # konsoldaki bağlantılar için (API adresinden farklıysa)
      project: ""             # ör. SEC ; kişisel depo: ~kullanici
      repo: ""                # ör. telveguard-config
      branch: main
      path: policies/policy.yaml
      mode: commit            # commit | pull_request (dal korumalıysa)
      reviewers: []           # pull_request: gözden geçirenler (kullanıcı adları)
      content: full           # full: ConfigMap dosyası + kurallar (dağıtılabilir) | rules: yalnızca kurallar
      strict: false           # true: Git'e yazılamazsa yayına alma reddedilir
      message: ""             # commit mesajı şablonu; boşsa varsayılan
      caFile: ""              # kurum içi CA (ör. extraEnv / volume ile bağlanan PEM yolu)

# ---------------- sırlar ----------------
# Önerilen: Secret'ı chart dışında (Vault / sealed-secrets / oc create secret) oluşturup adını verin.
# Beklenen anahtarlar (hepsi opsiyonel): admin-token, upstream-external-key,
# upstream-internal-key, upstream-anthropic-key, upstream-anthropic-internal-key, clickhouse-password,
# redis-password, shadow-ai-token (tarayıcı eklentisi olayları), policy-store-password, policy-git-token,
# guardrail-token (LiteLLM / agentgateway guardrail servisi; deploy/guardrail/),
# subject-hash-key (KVKK ilgili kişi araması; en az 32 karakter, değişirse eski kayıtlar bulunamaz)
existingSecret: ""
# existingSecret boşsa chart bu değerlerden Secret üretir (geliştirme / test için).
# adminToken boşsa yönetim uçları (Röntgen, simülatör, raporlar) KAPALIDIR.
secrets:
  adminToken: ""
  upstreamExternalKey: ""
  upstreamInternalKey: ""
  upstreamAnthropicKey: ""
  clickhousePassword: ""
  subjectHashKey: ""        # boşsa ilgili kişi araması kapalı

# ---------------- opsiyonel modeller (air-gapped) ----------------
# scripts/mirror_models.sh ile indirilen modeller bir PVC'de: /models/tr-ner, /models/prompt-injection
models:
  existingClaim: ""
  enableTrNer: false
  enableLlmGuard: false

# Sağlayıcı anahtarları (politikadaki providers[].key_env) buradan Secret'tan verilir, ör.:
#   - name: AZURE_OPENAI_KEY
#     valueFrom: { secretKeyRef: { name: tg-sirlar, key: azure-openai-key } }
extraEnv: []              # [{name: X, value: Y}] ya da valueFrom

# ---------------- ağ ----------------
service:
  type: ClusterIP
  port: 8080

# OpenShift Route (OKD). Kubernetes'te ingress.enabled kullanın.
route:
  enabled: true
  host: ""                # boşsa küme varsayılanı
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: telveguard.local
  tls: []                 # [{secretName: ..., hosts: [...]}]

# Gateway'e yalnızca izin verilen kaynaklardan erişilsin (istemci namespace'leri + router)
# ---------------- ağ tarafı (ICAP) ----------------
# Kurum proxy'si (Squid, ProxySG, Forcepoint, Zscaler ...) TLS denetimiyle çözdüğü AI isteklerini
# ICAP REQMOD ile sorar: masaüstü uygulamaları (Claude Desktop, ChatGPT, Copilot) ve eklentisiz
# tarayıcılar. Proxy'ler genellikle küme dışındadır: ayrı bir Service (LoadBalancer / NodePort).
icap:
  enabled: false
  port: 1344
  # Zorunlu: yalnızca bu adreslerdeki proxy'ler bağlanabilir (kimlik başlıklarına güvenilir)
  allowedClients: []        # ör. ["10.20.30.0/24"]
  teamPrefix: ""            # proxy grupları -> ekip (boş: auth.oidc.teamPrefix)
  unscannable: allow        # okunamayan gövde (ikili dosya, sıkıştırma): allow | block
  maxBody: 5242880          # taranan en fazla gövde (bayt); fazlası taranmadan geçer
  extraHosts: []            # SITES dışında taranacak alan adları
  service:
    type: LoadBalancer
    annotations: {}

networkPolicy:
  enabled: false
  # Boş liste: aynı namespace. OKD router için: {kubernetes.io/metadata.name: openshift-ingress}
  allowFromNamespaces: []

# ---------------- çalışma ----------------
serviceAccount:
  create: true
  name: ""

# OKD rastgele UID atar: runAsUser VERMEYİN (restricted-v2 SCC ile uyumlu)
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 512Mi }   # NER/LLM Guard açıksa ~2-3Gi gerekir

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Prometheus: /metrics (OKD user workload monitoring için ServiceMonitor)
metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
