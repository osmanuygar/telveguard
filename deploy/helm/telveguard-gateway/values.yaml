# Telveguard Gateway - Helm değerleri (OKD / OpenShift öncelikli).
# Kafka ve ClickHouse bu chart'ın parçası değildir; kurumdaki mevcut kümelere bağlanır.
# ClickHouse şeması: clickhouse/init.sql (bir kez çalıştırın).

image:
  # Air-gapped: Harbor yolu, ör. harbor.sirket.local/telveguard/gateway
  repository: telveguard/gateway
  tag: ""                 # boşsa Chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 2
# Pod başına uvicorn worker sayısı; ölçekleme için önce replica artırın
workers: 2

# ---------------- istemci kimliği ----------------
auth:
  # jwt: OIDC (Keycloak / Entra ID) token'ı zorunlu; kullanıcı ve ekipler token'dan gelir.
  # header: x-telveguard-user / x-telveguard-team header'ları, DOĞRULAMA YOK (yalnızca test).
  mode: jwt
  oidc:
    issuer: ""            # ör. https://sso.sirket.local/realms/ai  (zorunlu)
    audience: ""          # token'ın "aud" değeri, ör. telveguard     (zorunlu)
    jwksUrl: ""           # boşsa issuer/.well-known/openid-configuration'dan bulunur
    userClaim: preferred_username   # Entra ID: preferred_username / upn
    teamClaim: groups               # Keycloak rolleri için: realm_access.roles
    teamPrefix: ""                  # ör. "telveguard-": yalnızca bu önekli gruplar ekip sayılır
    # Bu gruptaki kullanıcılar yönetim uçlarına (Röntgen, simülatör, KVKK raporu) kendi JWT'leriyle
    # erişir; statik admin-token'a gerek kalmaz. Ör. telveguard-admin
    adminGroup: ""

# ---------------- upstream LLM'ler ----------------
upstream:
  internalUrl: http://vllm:8000/v1          # kurum içi (vLLM / Ollama)
  externalUrl: https://api.openai.com/v1    # yurt dışı sağlayıcı (maskeli gider)
  # Anthropic /v1/messages (Claude SDK, Claude Code); taban adres /v1 içermez
  anthropicUrl: https://api.anthropic.com
  anthropicInternalUrl: ""                  # Anthropic biçimini kabul eden kurum içi sunucu (opsiyonel)

# ---------------- denetim (Kafka) ----------------
audit:
  kafkaBootstrap: ""      # ör. kafka-bootstrap.kafka.svc:9092 ; boşsa olaylar stdout'a JSON yazılır
  topic: telveguard.audit.v1
  # 1: maskelenmiş prompt da saklanır (PII yer tutucu hâlinde). Ham prompt hiçbir zaman saklanmaz.
  storeMasked: false

# ---------------- Röntgen + KVKK raporu (ClickHouse) ----------------
clickhouse:
  url: ""                 # ör. http://clickhouse.telveguard.svc:8123 ; boşsa Röntgen uçları 503 döner
  user: telveguard_reader # yalnızca SELECT yetkili kullanıcı önerilir
  database: telveguard

# ---------------- kota sayacı ----------------
# Politikada `quotas` varsa sayaç Redis'te tutulmalı; yoksa limitler worker / pod başına olur.
quota:
  redisUrl: ""            # ör. redis://redis.telveguard.svc:6379/0 (parola: secret'taki redis-password)

# ---------------- politika ----------------
policy:
  # Doluysa bu ConfigMap kullanılır (anahtar: policy.yaml); boşsa chart'taki files/policy.yaml
  existingConfigMap: ""
  # Chart'taki varsayılan politikayı tamamen değiştirmek için YAML metni (opsiyonel)
  content: ""
  # AI sistem beyanları (EU AI Act envanteri); boşsa chart'taki files/inventory.yaml örneği.
  # existingConfigMap kullanılıyorsa bu ConfigMap'te inventory.yaml anahtarı da olmalı.
  inventoryContent: ""

# ---------------- sırlar ----------------
# Önerilen: Secret'ı chart dışında (Vault / sealed-secrets / oc create secret) oluşturup adını verin.
# Beklenen anahtarlar (hepsi opsiyonel): admin-token, upstream-external-key,
# upstream-internal-key, upstream-anthropic-key, upstream-anthropic-internal-key, clickhouse-password,
# redis-password
existingSecret: ""
# existingSecret boşsa chart bu değerlerden Secret üretir (geliştirme / test için).
# adminToken boşsa yönetim uçları (Röntgen, simülatör, raporlar) KAPALIDIR.
secrets:
  adminToken: ""
  upstreamExternalKey: ""
  upstreamInternalKey: ""
  upstreamAnthropicKey: ""
  clickhousePassword: ""

# ---------------- opsiyonel modeller (air-gapped) ----------------
# scripts/mirror_models.sh ile indirilen modeller bir PVC'de: /models/tr-ner, /models/prompt-injection
models:
  existingClaim: ""
  enableTrNer: false
  enableLlmGuard: false

extraEnv: []              # [{name: X, value: Y}]

# ---------------- ağ ----------------
service:
  type: ClusterIP
  port: 8080

# OpenShift Route (OKD). Kubernetes'te ingress.enabled kullanın.
route:
  enabled: true
  host: ""                # boşsa küme varsayılanı
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: telveguard.local
  tls: []                 # [{secretName: ..., hosts: [...]}]

# Gateway'e yalnızca izin verilen kaynaklardan erişilsin (istemci namespace'leri + router)
networkPolicy:
  enabled: false
  # Boş liste: aynı namespace. OKD router için: {kubernetes.io/metadata.name: openshift-ingress}
  allowFromNamespaces: []

# ---------------- çalışma ----------------
serviceAccount:
  create: true
  name: ""

# OKD rastgele UID atar: runAsUser VERMEYİN (restricted-v2 SCC ile uyumlu)
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 512Mi }   # NER/LLM Guard açıksa ~2-3Gi gerekir

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Prometheus: /metrics (OKD user workload monitoring için ServiceMonitor)
metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
