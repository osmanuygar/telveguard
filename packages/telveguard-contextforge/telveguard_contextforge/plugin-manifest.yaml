description: "Telveguard: Türkçe PII (TCKN/VKN/IBAN/GSM/plaka) ve sır (API anahtarı/token) maskeleme, PII sızdırma ve prompt injection engelleme"
author: "Telveguard"
version: "0.3.0"
available_hooks:
  - "prompt_pre_fetch"
  - "tool_pre_invoke"
  - "tool_post_invoke"
default_configs:
  mask_entities: [TCKN, VKN, IBAN_TR, CREDIT_CARD, PHONE_TR, EMAIL_ADDRESS, PLATE_TR, "SECRET_*"]
  external_tools: ["slack*", "email*", "web_*", "http_*", "github*"]
  exfil_block_entities: [TCKN, VKN, IBAN_TR, CREDIT_CARD, "SECRET_*"]
  injection_block_threshold: 0.85
