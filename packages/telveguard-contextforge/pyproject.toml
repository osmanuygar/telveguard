[build-system]
requires = ["setuptools>=77"]  # SPDX license + license-files
build-backend = "setuptools.build_meta"

[project]
name = "telveguard-contextforge"
version = "0.2.1"
description = "Telveguard eklentisi: IBM ContextForge için Türkçe PII, sır ve prompt injection koruması"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["mcp", "contextforge", "pii", "kvkk", "ai-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Natural Language :: Turkish",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = ["telveguard-core>=0.2.1", "cpex>=0.1.4"]

[project.urls]
Homepage = "https://github.com/osmanuygar/telveguard"
Source = "https://github.com/osmanuygar/telveguard"
Issues = "https://github.com/osmanuygar/telveguard/issues"

[tool.setuptools.packages.find]
include = ["telveguard_contextforge*"]

[tool.setuptools.package-data]
telveguard_contextforge = ["plugin-manifest.yaml"]
