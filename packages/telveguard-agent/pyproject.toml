[build-system]
requires = ["setuptools>=77"]  # SPDX license + license-files
build-backend = "setuptools.build_meta"

[project]
name = "telveguard-agent"
version = "0.3.0"
description = "Cursor ve Claude Code'u Telveguard'a bağlayan hook'lar ve kurum hesabıyla giriş (telve)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["cursor", "claude-code", "hooks", "kvkk", "dlp", "ai-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Natural Language :: Turkish",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# Gateway'e ulaşılamadığında yerel tarama için (yalnızca pyyaml'a bağımlı, hafif)
dependencies = ["telveguard-core>=0.3.0"]

[project.scripts]
telve = "telveguard_agent.cli:main"

[project.urls]
Homepage = "https://github.com/osmanuygar/telveguard"
Source = "https://github.com/osmanuygar/telveguard"
Issues = "https://github.com/osmanuygar/telveguard/issues"

[tool.setuptools.packages.find]
include = ["telveguard_agent*"]
